<!DOCTYPE html>

<html>
  <head>
    <meta charset="UTF-8" />
    <title>Embedded ToolBox</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <div class="canvas-container">
      <div class="canvas-wrapper">
        <canvas id="camera_canvas" class="movie_canvas" width="640" height="480"></canvas>
        <div class="camera-controls-overlay bottom-controls">
          <div class="camera-basic-controls">
            <select name="camera_device_sel" id="camera_device_sel">
              <option value="" hidden>No camera device...</option>
            </select>
            <input id="camera_device_play" name="camera_device_play" type="button" value="Play" disabled />
            <span id="camera_elapsed_time" class="now_time">00:00:00</span>
            <button id="toggle-controls" class="toggle-button">⚙️</button>
          </div>
          
          <div id="camera_controls_panel" class="controls-panel hidden">
            <div id="camera_controls" class="controls-container"></div>
          </div>
        </div>
      </div>
      <div class="canvas-wrapper">
        <canvas id="drpai_canvas" class="movie_canvas" width="640" height="480"></canvas>
        <div class="model-controls bottom-controls">
          <select name="drpai_model_sel" id="drpai_model_sel">
            <option value="" hidden>No models available...</option>
          </select>
          <input id="drpai_model_start" name="drpai_model_start" type="button" value="Start" disabled />
        </div>
      </div>
    </div>

    <div class="bottom-container">
      <div class="graph-container">
        <canvas id="graph_canvas" class="graph_canvas" width="640" height="320"></canvas>
      </div>
      <div class="stats-container">
        <table id="table_stats">
          <tr>
            <td>
              <p class="subtitle">Detection Info</p>
              <textarea id="pred_window"></textarea>
            </td>
            <td>
              <p class="subtitle">Proc Time</p>
              <textarea id="drp_window"></textarea>
            </td>
          </tr>
        </table>
      </div>
    </div>

    <script src="libs/jquery-3.4.1.min.js"></script>
    <script src="libs/Chart.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
